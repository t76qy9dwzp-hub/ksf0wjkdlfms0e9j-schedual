name: Stundenplan aktualisieren

on:
  schedule:
    - cron: "0 * * * *"   # jede Stunde
  workflow_dispatch:       # manuell startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: ICS erzeugen
        env:
          DAVINCI_URL: ${{ secrets.DAVINCI_URL }}
          DAVINCI_METHOD: ${{ secrets.DAVINCI_METHOD }}
          DAVINCI_BODY: ${{ secrets.DAVINCI_BODY }}
        run: python generate_ics.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stundenplan.ics
          git diff --cached --quiet || git commit -m "Stundenplan aktualisiert"
          git push
